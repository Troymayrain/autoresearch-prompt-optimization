[project]
name = "card-ocr-prompt-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.poe.tasks.code-smoke]
cmd = "python -m optimizer.autorun --task code --dataset 'datasets/IT-ST-RZ(TB)_1.xlsx'"
env = { MAX_ITERATIONS = "0" }
help = "Run one-row gift card code OCR prompt optimizer smoke check"

[tool.poe.tasks.code-full]
cmd = "python -m optimizer.autorun --task code --dataset 'datasets/IT-ST-RZ(TB)_500.xlsx'"
help = "Run full gift card code OCR prompt optimizer experiment"

[tool.poe.tasks.type-smoke]
cmd = "python -m optimizer.autorun --task type --dataset 'datasets/type_ocr_1.xlsx'"
env = { MAX_ITERATIONS = "0" }
help = "Run one-row card type OCR prompt optimizer smoke check"

[tool.poe.tasks.type-full]
cmd = "python -m optimizer.autorun --task type --dataset 'datasets/type_ocr_500.xlsx'"
help = "Run full card type OCR prompt optimizer experiment"
